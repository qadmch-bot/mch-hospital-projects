<style id="mch-department-layout-fix">
/* Restore the approved three-panel overview layout at desktop sizes. */
@media (min-width: 1200px) {
  .ovx .r2 {
    display:grid !important;
    grid-template-columns:minmax(0, 1.38fr) minmax(0, 1.34fr) minmax(280px, 1fr) !important;
    gap:14px !important;
    align-items:stretch;
  }
  .ovx .r2 > :last-child {
    grid-column:3 !important;
    grid-row:1 !important;
  }
  .ovx .r2 > .card { min-width:0; }
  .ovx .r3 {
    grid-template-columns:minmax(0, 2.7fr) minmax(285px, 1fr) !important;
  }
  .ovx .r2 .dpx {
    display:flex !important;
    flex-direction:column !important;
    gap:12px !important;
    padding-top:6px;
  }
  .ovx .r2 .dpx button {
    display:grid;
    grid-template-columns:minmax(78px, 102px) minmax(0,1fr) 23px;
    gap:8px;
    width:100%;
    align-items:center;
  }
}
@media (min-width: 1200px) and (max-width: 1399px) {
  .ovx .r2 { grid-template-columns:minmax(0,1.1fr) minmax(0,1.05fr) minmax(255px,.9fr) !important; }
  .ovx .r2 .dn { grid-template-columns:1fr !important; justify-items:center; }
  .ovx .r2 .dn .legend { width:100%; }
}
@media (max-width: 1199px) and (min-width: 901px) {
  .ovx .r2 { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
  .ovx .r2 > :last-child { grid-column:1/-1 !important; }
  .ovx .r2 .dpx { display:grid;grid-template-columns:repeat(2,minmax(0,1fr)); }
}
@media (max-width: 900px) {
  .ovx .r2 > :last-child { grid-column:auto !important; }
}
</style>

*{box-sizing:border-box}

/* ---------- header ---------- */

.clock{padding-top:0;align-self:center}.clock .d{font-size:clamp(12px,.95vw,16px)}.clock .t{font-size:clamp(26px,2.4vw,37px)}.clock .s{font-size:clamp(15px,1.4vw,20px);line-height:1.12}
body.ov .clock .s{position:static;width:auto}
.shell{grid-template-columns:200px minmax(0,1fr);gap:clamp(12px,1.1vw,20px)}
.side{min-width:0}.nav-btn{font-size:13px;padding:10px 11px;gap:10px}.nav-btn svg{width:19px;height:19px}
.main,.ovx,.ovx .r1,.ovx .r2,.ovx .r3,.ovx .r4{min-width:0}
.ovx{gap:14px}.ovx .r1{grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.ovx .r1 .sp{display:none}
.kx{min-width:0;min-height:105px;gap:clamp(8px,.85vw,14px);padding:12px clamp(10px,.95vw,16px);border-radius:15px;overflow:hidden}
.kx .ic{width:clamp(40px,3.4vw,56px);height:clamp(40px,3.4vw,56px)}.kx .ic svg{width:55%;height:55%}
.kx .kl{font-size:clamp(11px,.86vw,14px);line-height:1.25;display:block}.kx .kn{font-size:clamp(26px,2.15vw,36px)}.kx .kp{font-size:clamp(12px,1.12vw,18px)}.kx .row2{gap:7px;flex-wrap:wrap}.kx .ks{display:block;font-size:10.5px;line-height:1.25;overflow-wrap:anywhere}
.ovx .r2{grid-template-columns:minmax(0,1.16fr) minmax(0,1.14fr) minmax(0,.90fr);gap:12px}
.ovx .r3{grid-template-columns:minmax(0,2.2fr) minmax(285px,1fr);gap:12px}
.ovx .r4{grid-template-columns:minmax(0,1fr);gap:12px}
.ovx .r4 .hb{display:none}
.r2 .card,.r3 .card{padding:14px;min-width:0;overflow:hidden}.card h2{font-size:clamp(14px,1.12vw,17px);line-height:1.25}
.dn{grid-template-columns:minmax(130px,46%) minmax(0,1fr);gap:10px;min-height:210px}
.dn .donut-box{width:min(100%,205px);height:auto;aspect-ratio:1}.dn .donut-box canvas{width:100%!important;height:100%!important}
.dn .donut-box .center b{font-size:clamp(26px,2.1vw,38px)}.dn .donut-box .center span{font-size:12px}
.dn .legend{padding:6px}.dn .legend button{padding:6px 4px;font-size:clamp(10px,.85vw,13px);gap:6px;min-width:0}.dn .legend .sw{width:11px;height:11px}.dn .legend .lv{font-size:12px}
.msx .it{grid-template-columns:90px 14px minmax(0,1fr);gap:7px;padding:7px}.msx::before{left:105px}.msx .dt{font-size:11px}.msx .t1{font-size:12px}.msx .t2{font-size:10.5px}
.dpx button{grid-template-columns:minmax(65px,95px) minmax(0,1fr) 20px;gap:7px;font-size:12px}.dpx .tr{height:16px}
.fx{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.fc{min-width:0}.fc .ph{height:105px}.fc .t{font-size:13px}.fc .s{font-size:11.5px}.fc .bd{padding:10px}
.ux .it{grid-template-columns:30px minmax(0,1fr) auto;gap:7px}.ux .ui{width:29px;height:29px}.ux .w{font-size:10px}.ux .n{font-size:11.5px}.ux .d{font-size:11px}
.vx{padding:13px 18px;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.vx h3{font-size:17px}.vx .vs{font-size:11.5px}
.girl{height:360px;max-width:100%;overflow:hidden}
.note.preview-note{background:#F3F5F7;border:1px solid #CDD4DE;color:#354252;margin-bottom:2px}
@media(max-width:1530px){.hdr{grid-template-columns:minmax(200px,275px) minmax(225px,1fr) minmax(205px,315px) minmax(150px,180px)}.shell{grid-template-columns:180px minmax(0,1fr)}.ovx .r2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.ovx .r2>:last-child{grid-column:1/-1}.dpx{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px 18px}.fx{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1180px){.hdr{grid-template-columns:minmax(190px,250px) minmax(0,1fr) minmax(160px,220px)}.hphoto{display:none}.ovx .r1{grid-template-columns:repeat(3,minmax(0,1fr))}.ovx .r3{grid-template-columns:1fr}.ovx .r2{grid-template-columns:repeat(2,minmax(0,1fr))}.fx{grid-template-columns:repeat(4,minmax(0,1fr))}.kx .ic{width:48px;height:48px}}
@media(max-width:900px){.shell{grid-template-columns:minmax(0,1fr)}.side{position:relative;display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:4px 0}.nav-btn{flex:0 0 auto;width:auto}.side-sep,.who,.girl{display:none}.hdr{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 170px}.ovx .r2{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.app{padding-inline:12px}.hdr{grid-template-columns:minmax(0,1fr) auto;gap:8px;padding-block:14px}.brand{grid-column:1/-1}.htitle{text-align:left}.htitle h1{font-size:25px}.clock{text-align:right}.clock .d{font-size:11px}.clock .t{font-size:25px}.clock .s{display:none}.ovx .r1{grid-template-columns:repeat(2,minmax(0,1fr))}.ovx .r2,.ovx .r3{grid-template-columns:1fr}.ovx .r2>:last-child{grid-column:auto}.dpx{grid-template-columns:1fr}.fx{grid-template-columns:repeat(2,minmax(0,1fr))}.dn{grid-template-columns:minmax(0,1fr)}.dn .donut-box{width:200px;justify-self:center}.vx{grid-template-columns:1fr}.kx{min-height:96px}}
@media(max-width:410px){.ovx .r1{grid-template-columns:1fr 1fr;gap:8px}.kx{flex-direction:column;align-items:flex-start;gap:6px}.kx .ic{width:38px;height:38px}.fx{grid-template-columns:1fr}.clock .t{font-size:22px}}
</style>

/* ---------- derived data ---------- */
const D = { list: [], byId: new Map(), subs: [], notifs: [], attention: [], owners: [], depts: [] };
function allSubmissions() {
  const out = [];
  S.submissions.forEach((doc, uidKey) => (doc.items || []).forEach(it => {
    const rv = S.reviews.get(it.id);
    out.push(Object.assign({}, it, { uid: uidKey, review: rv || null, state: rv ? rv.decision : 'pending' }));
  }));
  return out.sort((a, b) => (b.at || '').localeCompare(a.at || ''));
}
function actionProgressValue(a) {
  if (a.status === 'Completed' && a.progress == null) return 100;
  return a.progress == null ? null : Number(a.progress);
}
function computeProgress(p) {
  const acts = p.actions || [];
  const st = ST();
  if (acts.length && acts.some(a => actionProgressValue(a) != null)) {
    let w = 0, s = 0;
    acts.forEach(a => { const wt = st.weightedProgress ? Math.max(0, Number(a.weight) || 0) : 1; w += wt; s += wt * (actionProgressValue(a) || 0); });
    return w ? s / w : null;
  }
  return p.approvedProgress == null ? null : Number(p.approvedProgress);
}
function plannedProgress(p) {
  if (!p.startDate || !p.endDate) return null;
  const t = today(); const tot = daysBetween(p.startDate, p.endDate); if (!tot || tot <= 0) return null;
  return Math.max(0, Math.min(100, daysBetween(p.startDate, t) / tot * 100));
}
function ownerLabel(p) { return p.owner || p.lead || ''; }
function derive() {
  const t = today(); const st = ST();
  const list = Array.from(S.projects.values()).map(p => {
    const acts = p.actions || [], ms = p.milestones || [];
    const overdueActs = acts.filter(a => a.due && a.due < t && a.status !== 'Completed');
    const overdueMs = ms.filter(m => m.due && m.due < t && m.status !== 'Completed');
    const pastEnd = !!(p.endDate && p.endDate < t && p.operationalStatus !== 'Completed');
    const prog = computeProgress(p);
    const reasons = [];
    if (['At Risk', 'Delayed'].includes(p.operationalStatus)) reasons.push(`Status is ${p.operationalStatus}`);
    if (st.atRiskRules?.pastEndDate !== false && pastEnd) reasons.push(`Past planned end date (${fmtDate(p.endDate)}) without verified completion`);
    if (overdueActs.length >= (st.atRiskRules?.overdueActions || 2)) reasons.push(`${plural(overdueActs.length, 'action')} past due`);
    (p.decisionsRequired || []).filter(x => !x.resolved).forEach(x => reasons.push('Decision required: ' + x.text));
    (p.issues || []).filter(x => !x.resolved && x.severity === 'High').forEach(x => reasons.push('High-severity issue: ' + x.text));
    if (!ownerLabel(p)) reasons.push('No project owner or lead assigned');
    return Object.assign({}, p, { _overdueActs: overdueActs, _overdueMs: overdueMs, _pastEnd: pastEnd, _prog: prog, _planned: plannedProgress(p), _reasons: reasons,
      _pendingActs: acts.filter(a => a.status !== 'Completed').length, _owner: ownerLabel(p) });

  // owners
  const om = new Map();
  list.forEach(p => {
    const names = new Set([p.owner, p.lead].filter(Boolean)); if (!names.size) names.add('Unassigned');
    names.forEach(n => { if (!om.has(n)) om.set(n, { name: n, projects: [], completed: 0, active: 0, overdue: 0, pendingActions: 0, overdueActions: 0 }); const o = om.get(n); o.projects.push(p); if (p.operationalStatus === 'Completed') o.completed++; else o.active++; if (p._pastEnd) o.overdue++; });

/* ---------- notifications (deterministic keys → no duplicates) ---------- */
function computeNotifications() {
  const t = today(); const st = ST(); const offs = st.reminderOffsets || [];
  const out = [];
  const push = (key, n) => out.push(Object.assign({ key }, n));
  D.list.forEach(p => {
    const items = [];
    (p.actions || []).forEach(a => { if (a.status !== 'Completed' && a.due) items.push({ kind: 'Action', id: a.id, title: a.action, due: a.due, who: a.responsible }); });
    (p.milestones || []).forEach(m => { if (m.status !== 'Completed' && m.due) items.push({ kind: 'Milestone', id: m.id, title: m.title, due: m.due, who: m.responsible }); });
    if (p.endDate && p.operationalStatus !== 'Completed') items.push({ kind: 'Project end date', id: p.id + '-END', title: p.shortTitle || p.title, due: p.endDate, who: p._owner });
    items.forEach(it => {
      const d = daysBetween(t, it.due);
      if (d < 0) {
        if (offs.includes(-1)) push(`${it.id}_overdue`, { type: 'overdue', sev: 'bad', projectId: p.id, title: `${it.kind} overdue by ${plural(-d, 'day')}`, text: it.title, who: it.who, due: it.due });
      } else {
        const hit = offs.filter(o => o >= 0).sort((a, b) => a - b).find(o => d <= o);
        if (hit != null) push(`${it.id}_d${hit}`, { type: 'deadline', sev: d <= 1 ? 'warn' : 'blue', projectId: p.id, title: d === 0 ? `${it.kind} due today` : `${it.kind} due in ${plural(d, 'day')}`, text: it.title, who: it.who, due: it.due });
      }
    });
    // missing updates
    if (p.operationalStatus !== 'Completed') {
      const last = [p.lastProgressUpdateAt, ...D.subs.filter(s => s.projectId === p.id).map(s => s.at)].filter(Boolean).sort().pop();
      const since = last ? daysBetween(last.slice(0, 10), t) : null;
      if (since == null || since > (st.missingUpdateDays || 30)) push(`${p.id}_noupdate_${t.slice(0, 7)}`, { type: 'missing', sev: 'warn', projectId: p.id, title: since == null ? 'No progress update on record' : `No progress update for ${since} days`, text: p.shortTitle || p.title, who: p._owner });
    }
    if (p._reasons.length && D.attention.includes(p)) push(`${p.id}_attention_${t.slice(0, 7)}`, { type: 'attention', sev: 'bad', projectId: p.id, title: 'Requires management attention', text: (p.shortTitle || p.title) + ' — ' + p._reasons[0], who: p.sponsor || p._owner });
  });
  D.subs.filter(s => s.state === 'pending').forEach(s => push(`sub_${s.id}`, { type: 'approval', sev: 'verify', projectId: s.projectId, title: s.kind === 'evidence' ? 'Evidence awaiting approval' : 'Submission awaiting approval', text: subLabel(s), who: 'Quality Administrator' }));
  S.documents.forEach(d => { if (d.review && d.review.status === 'pending') push(`doc_${d.id}`, { type: 'approval', sev: 'verify', projectId: d.projectId, title: 'Document awaiting approval', text: d.name, who: 'Quality Administrator' }); });
  const rank = { bad: 0, warn: 1, verify: 2, blue: 3 };
  return out.sort((a, b) => rank[a.sev] - rank[b.sev] || String(a.due || '9').localeCompare(String(b.due || '9')));
}
function subLabel(s) {
  const p = D.byId.get(s.projectId); const pn = p ? (p.code + ' ' + (p.shortTitle || p.title)) : s.projectId;
  const k = { progress: 'Progress update', action: 'Action update', kpi: 'KPI reading', evidence: 'Evidence file', comment: 'Comment', issue: 'Issue / decision', newProject: 'New project proposal' }[s.kind] || s.kind;
  return `${k} · ${pn}`;
}
async function persistNotifLog() {

    try { const r = await S.caps.assets.upload(file, { type: ASSET_TYPES[ext] }); return { kind: 'asset', id: r.id, size: r.sizeBytes, type: r.contentType }; }
    catch (e) { if (!['unsupported_type'].includes(e && e.code)) console.warn('asset upload failed, using db storage', e); }
  }

  const buf = await file.arrayBuffer(); const data = b64(buf); const fileId = 'f' + uid8();

  return `<div class="upd-i" ${p ? `data-proj="${esc(p.id)}" data-tab="history" role="button" tabindex="0" style="cursor:pointer"` : ''}>
    <span class="ui" style="background:var(${col})">${ic(icn)}</span>
    <div style="min-width:0"><div class="ut">${esc(p ? (p.shortTitle || p.title) : 'System')}</div><div class="ud">${esc(it.text)}</div><div class="small muted">${esc(personName(it.by))}</div></div>
    <div class="uw">${esc(fmtDT(it.at).replace(/, (\d\d:\d\d)$/, '\n$1'))}</div></div>`;
}

function projPhoto(p) {
  const t = norm([p.title, p.shortTitle, p.department].join(' '));
  if (/neonat|nicu|incubat|early warning|extubation|picu/.test(t)) return 'nicu';
  if (/breastfeed|well baby|natural birth|multidisciplinary|birth readiness|continuity|exercise room/.test(t)) return 'room';
  if (/triage|emergency|per\b|obs er|hourly round|journey|opd/.test(t)) return 'er';
  if (/walking|play area/.test(t)) return 'play';
  return null;
}
function projArt(p) {
  if (p.coverAssetId) return `<img src="/_blob/${esc(p.coverAssetId)}" alt="">`;
  const k = projPhoto(p);
  if (k) return `<img src="${PHOTO_SRC[k]}" alt="" title="Illustrative image — upload the project's own photo from the project page">`;
  const c = deptColor(p.department); const icn = projIcon(p);
  return `<svg viewBox="0 0 240 108" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs><linearGradient id="g${esc(p.id)}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c}"/><stop offset="1" stop-color="${c}" stop-opacity=".55"/></linearGradient></defs><rect width="240" height="108" fill="url(#g${esc(p.id)})"/><g opacity=".14" fill="none" stroke="#fff" stroke-width="1.5">${[0, 1, 2, 3, 4].map(i => `<circle cx="${200 - i * 6}" cy="${18 + i * 4}" r="${28 + i * 16}"/>`).join('')}</g><g transform="translate(96,26) scale(2.2)" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${IP[icn]}</g></svg>`;
}
function cardSub(p) {
  if (p.cardSubtitle) return p.cardSubtitle;
  const o = String(p.objective || '').split(/[.;]/)[0];
  return o && o.length < 90 ? o : `${p.department || ''} · ${p.category || 'Quality Improvement'}`;
}
function featCard(p) {
  return `<div class="fc" data-proj="${esc(p.id)}" role="button" tabindex="0" aria-label="Open ${esc(p.shortTitle || p.title)}">
    <div class="ph">${projArt(p)}</div>
    <div class="bd"><div class="t" title="${esc(p.shortTitle || p.title)}">${esc(p.shortTitle || p.title)}</div><div class="s" title="${esc(cardSub(p))}">${esc(cardSub(p))}</div>
    <div class="small muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="Owner: ${esc(p._owner || 'not assigned')}">Owner: ${esc(p._owner || 'not assigned')}${p.endDate ? ' · Due ' + fmtDate(p.endDate) : ''}</div>
    <div class="pg">${bar(p._prog, progColor(p))}${p._prog == null ? '<em>Not verified</em>' : `<b class="num">${pct(p._prog)}</b>`}</div>
    <div class="ft">${stChip(p.operationalStatus)}<span class="go" aria-hidden="true">${ic('arrow')}</span></div></div></div>`;
}

function filteredProjects() {
  const f = S.f; const q = norm(f.q);
  let L = D.list.filter(p => {
    if (q && !norm([p.code, p.title, p.shortTitle, p.officialTitle, p.department, p.owner, p.lead, p.sponsor, p.category].join(' ')).includes(q)) return false;
    if (f.dept && p.department !== f.dept) return false;
    if (f.status === '__overdue') { if (!p._pastEnd) return false; }
    else if (f.status === 'At Risk') { if (!['At Risk', 'Delayed'].includes(p.operationalStatus)) return false; }
    else if (f.status && p.operationalStatus !== f.status) return false;
    if (f.prog === 'none' && p.programmeId) return false;
    if (f.prog && f.prog !== 'none' && p.programmeId !== f.prog) return false;
    if (f.owner && ![p.owner, p.lead].includes(f.owner)) return false;
    if (f.verify === 'verified' && p.operationalStatus === 'Pending Verification') return false;
    if (f.verify === 'pending' && p.operationalStatus !== 'Pending Verification') return false;
    if (f.verify === 'progress' && p._prog == null) return false;
    if (f.verify === 'attention' && !D.attention.includes(p)) return false;
    return true;
  });
  const s = f.sort;
  if (s === 'title') L.sort((a, b) => (a.shortTitle || a.title).localeCompare(b.shortTitle || b.title));
  if (s === 'dept') L.sort((a, b) => (a.department || '').localeCompare(b.department || ''));
  if (s === 'end') L.sort((a, b) => (a.endDate || '9999').localeCompare(b.endDate || '9999'));
  if (s === 'updated') L.sort((a, b) => (b.updatedAt || '').localeCompare(a.updatedAt || ''));
  if (s === 'progress') L.sort((a, b) => (b._prog ?? -1) - (a._prog ?? -1));
  return L;
}

function nextCode(prefix = 'QIP') {
  const n = D.list.map(p => (new RegExp('^' + prefix + '-(\\d+)$').exec(p.code || '') || [])[1]).filter(Boolean).map(Number);

  return D.list.filter(p => p.id !== excludeId && ((code && p.code && norm(p.code) === norm(code)) || similarity(title, p.title) >= 0.75 || similarity(title, p.shortTitle) >= 0.75));

function openReviewQueue(projectId) {
  const render = () => { const L = D.subs.filter(s => s.state === 'pending' && (!projectId || s.projectId === projectId)); return L.length ? L.map(s => subCard(s)).join('') : '<div class="empty"><b>Nothing waiting for review</b></div>'; };

    onMount: w => w.addEventListener('click', async e => {

      if (b.dataset.rv === 'save') { saveStoredFile(s.payload.storage, s.payload.name); return; }
      let reason = '';
      if (b.dataset.rv === 'rejected') { reason = await promptBox('Reject submission', 'Reason for rejection (shared with the submitter)', { required: true, ok: 'Reject' }); if (reason == null) return; }
      b.disabled = true;
      try { await reviewSubmission(s, b.dataset.rv, reason); toast(b.dataset.rv === 'approved' ? 'Approved and applied' : 'Rejected'); } catch (er) { console.error(er); dbErr(er, 'Review'); }
      setTimeout(() => { const box = $('#rq', w); if (box) box.innerHTML = render(); }, 400);
    }) });
}
function subCard(s) {
  const p = D.byId.get(s.projectId); const pl = s.payload || {};
  let detail = '';
  if (s.kind === 'progress') detail = `Reported progress <b>${pl.reportedProgress}%</b>; proposed status <b>${esc(pl.proposedStatus || '—')}</b><div class="prose small" style="margin-top:4px">${esc(pl.narrative)}</div>`;
  if (s.kind === 'action') { const a = p && (p.actions || []).find(x => x.id === pl.actionId); detail = `Action #${esc(a?.no ?? '?')}: ${esc(a?.action || '')}<br>Status → <b>${esc(pl.status)}</b>${pl.progress != null ? `, progress → <b>${pl.progress}%</b>` : ''}<div class="small" style="margin-top:4px">${esc(pl.note)}</div>`; }
  if (s.kind === 'kpi') { const k = p && (p.kpis || []).find(x => x.id === pl.kpiId); detail = `${esc(k?.name || 'KPI')}: <b>${esc(pl.value)}</b> for ${esc(pl.period)} ${pl.note ? '· ' + esc(pl.note) : ''}`; }
  if (s.kind === 'evidence') detail = `${esc(pl.category)} · <b>${esc(pl.name)}</b> (${fsize(pl.size)}) <button class="btn sm" data-rv="save" data-sid="${esc(s.id)}">${ic('dl')} Save a copy</button>${pl.note ? `<div class="small">${esc(pl.note)}</div>` : ''}`;
  if (s.kind === 'issue') detail = `${pl.type === 'issues' ? 'Issue' : 'Decision required'} (${esc(pl.severity)}): ${esc(pl.text)}`;
  if (s.kind === 'newProject') detail = `<b>${esc(pl.title)}</b> · ${esc(pl.department)} · Owner ${esc(pl.owner || '—')}${findDuplicates(pl.title, pl.code).length ? '<div class="note warn small" style="margin-top:6px">Possible duplicate of an existing project.</div>' : ''}`;
  const authorized = s.kind === 'newProject' || !p ? true : ((p.ownerUserIds || []).includes(s.uid) || (S.roles.get(s.uid)?.role === 'Department Manager' && S.roles.get(s.uid)?.department === p.department));
  return `<div class="card" style="box-shadow:none"><div class="row" style="justify-content:space-between"><div><b>${esc(subLabel(s))}</b><div class="small muted">${esc(personName(s.uid))} · ${fmtDT(s.at)}</div></div>
    <div class="row"><button class="btn sm ok" data-rv="approved" data-sid="${esc(s.id)}">${ic('check')} Approve</button><button class="btn sm bad" data-rv="rejected" data-sid="${esc(s.id)}">Reject</button></div></div>
    <div style="margin-top:8px">${detail}</div>${!authorized ? '<div class="note warn small" style="margin-top:8px">The submitter is not linked to this project as an owner or department manager.</div>' : ''}</div>`;
}
async function reviewSubmission(s, decision, reason) {
  const p = S.projects.get(s.projectId); const pl = s.payload || {}; const st = ST();
  if (decision === 'approved') {
    if (s.kind === 'progress' && p) {
      const patch = { reportedProgress: pl.reportedProgress, lastProgressUpdateAt: nowISO() };
      if (!(p.actions || []).length) patch.approvedProgress = pl.reportedProgress;
      await saveProject(p.id, patch, 'progress', `Progress update approved: ${pl.reportedProgress}%${(p.actions || []).length ? ' reported (approved progress is calculated from actions)' : ''}. ${pl.narrative.slice(0, 160)}`);
    }
    if (s.kind === 'action' && p) {
      const acts = clone(p.actions || []); const a = acts.find(x => x.id === pl.actionId);
      if (a) {
        let status = pl.status; let note = '';
        if (status === 'Completed' && a.evidenceRequired && st.evidenceRequiredForClosure && !actionEvidenceAccepted(p.id, a.id)) { status = 'Pending Verification'; note = ' (held at Pending Verification until evidence is accepted)'; }
        a.status = status; if (pl.progress != null) a.progress = pl.progress; if (status === 'Completed' && a.progress == null) a.progress = 100;
        a.notes = [a.notes, `${fmtDate(today())}: ${pl.note}`].filter(Boolean).join('\n');
        await saveProject(p.id, { actions: acts, lastProgressUpdateAt: nowISO() }, 'progress', `Action #${a.no} update approved: ${status}${pl.progress != null ? ', ' + pl.progress + '%' : ''}${note}`);
      }
    }
    if (s.kind === 'kpi' && p) {
      const ks = clone(p.kpis || []); const k = ks.find(x => x.id === pl.kpiId);
      if (k) { k.readings = [...(k.readings || []), { period: pl.period, value: pl.value, kind: 'actual', note: pl.note, at: pl.at, by: s.uid }]; k.actual = pl.value; await saveProject(p.id, { kpis: ks, lastProgressUpdateAt: nowISO() }, 'kpi', `KPI result approved: ${k.name} = ${pl.value} (${pl.period})`); }
    }
    if (s.kind === 'evidence') {
      const id = 'd' + Date.now().toString(36) + uid8();
      await dbSet('documents/' + id, { projectId: s.projectId, actionId: pl.actionId || null, category: pl.category, name: pl.name, size: pl.size, type: pl.type, storage: pl.storage, note: pl.note || '', uploadedBy: s.uid, at: s.at, submissionId: s.id, review: { status: 'accepted', by: S.me.id, at: nowISO(), reason: reason || '' } });
      await logActivity('evidence', s.projectId, `Evidence accepted: ${pl.name}`);
    }
    if (s.kind === 'issue' && p) { const t = pl.type === 'decisionsRequired' ? 'decisionsRequired' : 'issues'; await saveProject(p.id, { [t]: [...(p[t] || []), { id: pl.id, text: pl.text, severity: pl.severity, at: pl.at, by: s.uid, resolved: false }] }, 'issue', `${t === 'issues' ? 'Issue' : 'Decision required'} recorded: ${pl.text}`); }
    if (s.kind === 'newProject') {
      const id = (pl.code || nextCode()).replace(/[^A-Za-z0-9_\-.]/g, '-');
      if (S.projects.has(id)) throw new Error('A project with code ' + id + ' already exists. Edit the code before approving.');
      await dbSet('projects/' + id, blankProject(Object.assign({ id }, pl, { code: id, createdBy: s.uid, documentedStatusSource: 'Proposed by project owner' })));
      await logActivity('register', id, 'Project proposal approved and registered');
    }
  }
  await dbSet('reviews/' + s.id, { decision, reason: reason || '', by: S.me.id, at: nowISO(), uid: s.uid, projectId: s.projectId || null, kind: s.kind });
  await logActivity(decision === 'approved' ? 'approval' : 'rejection', s.projectId, `${subLabel(s)} ${decision}${reason ? ': ' + reason : ''}`);
}

VIEWS.timeline = {
  render() {
    const t = today(); const f = S.f;
    const dated = D.list.filter(p => p.startDate && p.endDate);
    const undated = D.list.filter(p => !(p.startDate && p.endDate));
    const years = Array.from(new Set(dated.flatMap(p => { const a = +p.startDate.slice(0, 4), b = +p.endDate.slice(0, 4); const o = []; for (let y = a; y <= b; y++) o.push(y); return o; }).concat([+t.slice(0, 4)]))).sort();
    const yr = f.tlYear || 'all';
    let from, to;
    if (yr === 'all') { from = (years[0] || +t.slice(0, 4)) + '-01-01'; to = (years[years.length - 1] || +t.slice(0, 4)) + '-12-31'; }
    else { from = yr + '-01-01'; to = yr + '-12-31'; }
    const span = daysBetween(from, to) + 1; const x = d => Math.max(0, Math.min(100, daysBetween(from, d) / span * 100));
    const cols = []; const y0 = +from.slice(0, 4), y1 = +to.slice(0, 4);
    for (let y = y0; y <= y1; y++) { if (f.tlView === 'quarter') for (let q = 0; q < 4; q++) cols.push({ d: `${y}-${String(q * 3 + 1).padStart(2, '0')}-01`, l: `Q${q + 1} ${y}` }); else for (let m = 0; m < 12; m++) cols.push({ d: `${y}-${String(m + 1).padStart(2, '0')}-01`, l: m === 0 ? `${MONTHS[m]} '${String(y).slice(2)}` : (f.tlView !== 'quarter' && yr === 'all' && y1 > y0 ? MONTHS[m].slice(0, 1) : MONTHS[m]) }); }
    const inRange = p => p.endDate >= from && p.startDate <= to;
    const rows = dated.filter(inRange);
    const tx = t >= from && t <= to ? x(t) : null;
    const head = `<div class="g-row g-head"><div class="g-name" style="background:var(--surface-2)">Project</div><div class="g-track" style="background:var(--surface-2)">${cols.map(c => `<div class="g-col" style="left:${x(c.d)}%">${c.l}</div>`).join('')}</div></div>`;
    const body = rows.map(p => {
      const col = cssVarName(p.operationalStatus);
      const ms = (p.milestones || []).filter(m => m.due && m.due >= from && m.due <= to);
      const acts = (p.actions || []).filter(a => a.due && a.due >= from && a.due <= to);
      return `<div class="g-row"><div class="g-name" data-proj="${esc(p.id)}" data-tab="milestones" role="button" tabindex="0" title="${esc(p.title)}">${esc(p.code)} · ${esc(p.shortTitle || p.title)}<small>${fmtDate(p.startDate)} – ${fmtDate(p.endDate)}</small></div>
        <div class="g-track">${cols.map(c => `<div class="g-col" style="left:${x(c.d)}%"></div>`).join('')}${tx != null ? `<div class="g-today" style="left:${tx}%" title="Today"></div>` : ''}
        <div class="g-bar" style="left:${x(p.startDate)}%;width:${Math.max(.6, x(p.endDate) - x(p.startDate))}%;background:var(${col})" title="${esc(p.operationalStatus)}"></div>
        ${acts.map(a => `<div style="position:absolute;top:33px;left:${x(a.due)}%;width:2px;height:8px;background:var(${a.status === 'Completed' ? '--ok' : a.due < t ? '--bad' : '--ink-3'})" title="Action #${esc(a.no)} due ${fmtDate(a.due)}: ${esc(a.action)}"></div>`).join('')}
        ${ms.map(m => `<div class="g-ms" style="left:${x(m.due)}%;background:var(${m.status === 'Completed' ? '--ok' : m.due < t ? '--bad' : '--accent'})" title="${esc(m.title)} — due ${fmtDate(m.due)} (${esc(m.status)})"></div>`).join('')}</div></div>`;
    }).join('');
    const allMs = []; D.list.forEach(p => { (p.milestones || []).forEach(m => allMs.push({ p, m, kind: 'Milestone' })); });

Strict rules:

/* ---------- clock ---------- */
function startClock() {
  const fd = new Intl.DateTimeFormat('en-GB', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const ft = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true });
  let lastDay = today();
  const tick = () => {
    const d = new Date(); const parts = ft.formatToParts(d); const g = k => (parts.find(x => x.type === k) || {}).value || '';
    const dp = fd.formatToParts(d); const gd = k => (dp.find(x => x.type === k) || {}).value || '';
    $('#clkDate').textContent = `${gd('weekday')}, ${gd('day')} ${gd('month')} ${gd('year')}`;
    $('#clkTime').innerHTML = `${g('hour')}:${g('minute')}<span style="opacity:.45;font-size:.6em">:${g('second')}</span><small>${g('dayPeriod')}</small>`;
    const td = today(); if (td !== lastDay) { lastDay = td; derive(); scheduleRender(); }
  };
  tick(); setInterval(tick, 1000);
}

ility":"Voice of the Patient / Family"}],"source":{"file":"02_Multidisciplinary_Team_MDT_for_Natural_Birth_Readiness.docx","type":"Quality Improvement Project Charter Worksheet","verifiedExtraction":true},"featured":false,"category":"Quality Improvement","programmeId":"safe-delivery","summary":"Provide coordinated antenatal education, psychosocial support and natural-birth readiness.","charter":{"background":"","problem":"Many women approach delivery without structured education, psychological preparation, or an agreed individual birth plan. This contributes to anxiety, requests for elective Caesarean Section, suboptimal breastfeeding initiation, and a higher overall CS rate (29.0–45.8% in 2024 vs target ≤ 30.2%). There is no formal multidisciplinary team that engages pregnant women across the antenatal journey, particularly primigravida women and women with one previous CS, who are the highest-leverage groups for natural-birth readiness.","aim":"Within 12 months (January – December 2025) establish a multidisciplinary team that delivers structured antenatal education, psychological and social support, individualised birth plans, breastfeeding promotion, and natural-birth readiness to ≥ 90% of eligible pregnant women, with a target of reducing the elective Caesarean Section rate by ≥ 20% among primigravida women and women with one previous CS.","smart":{},"scope":"","benefits":"","strategy":"Aligned with the hospital strategic objective of “Zero preventable maternal and neonatal deaths”, CBAHI Patient and Family Centred Care standards, MOH Baby-Friendly Hospital Initiative, and Saudi Vision 2030 Quality of Life pillar.","measures":"Outcome measures: Caesarean Section rate among primigravida women; CS rate among women with one previous CS; vaginal birth after Caesarean (VBAC) success rate; breastfeeding-initiation rate within first hour.\nProcess measures: % of eligible women enrolled in the MDT pathway (target ≥ 90%); % with documented individual birth plan; % attending antenatal education session; % receiving structured psychological / social support assessment.\nBalancing measures: Average length of stay; patient-experience satisfaction score; staff workload; unplanned obstetric escalations.","changeIdeas":["A. Charter the Natural Birth MDT with a clear weekly clinic schedule and accountable lead.","B. Deliver structured antenatal education on labour stages, pain relief, and natural-birth readiness.","C. Provide psychological and social support assessment and intervention by a clinical social worker.","D. Develop an individualised birth plan with every pregnant woman.","E. Promote breastfeeding through the lactation consultant from the antenatal period onward.","F. Strengthen pelvic-floor and antenatal physiotherapy to raise readiness for vaginal delivery."],"businessCase":"A well-prepared, informed and supported pregnant woman is far more likely to attempt and succeed at vaginal delivery, reducing CS-related operating-room time, anaesthesia consumables, surgical-site infections, blood-product use, and length of stay. The estimated investment of SAR 25,000 (MDT clinic time, education materials, training) is recovered through CS-rate reduction, shorter postnatal stays, and improved breastfeeding outcomes. The project strengthens the hospital’s alignment with CBAHI patient-centred-care standards and the Saudi Vision 2030 quality-of-life agenda."},"approvedProgress":null,"reportedProgress":null,"statusVerified":false,"createdBy":"Initial catalogue","updatedBy":"Initial catalogue"},{"id":"MCH-13","code":"MCH-13","title":"Antenatal Clinic Continuity with Named Consultants","shortTitle":"Antenatal Clinic Continuity with Named Consultants","officialTitle":"Sub-Project 3 – Antenatal Clinic Continuity with Named Consultants","department":"Obstetrics","documentedStatus":"Pending Verification","operationalStatus":"Pending Verification","operationalStatusSource":"Awaiting Quality Department verification","documentedStatusSource":"Previously supplied project information","owner":"","lead":"Consultant Obstetrician – Clinic Continuity Lead","sponsor":"Mr. Khalid Matar Alanizi – Hospital Director","startDate":"2025-01-01","endDate":"2025-12-31","budget":15000,"actions":[{"id":"MCH-13-A1","no":1,"action":"Charter the Clinic Continuity project and appoint Project Lead; agree the continuity policy.","responsible":"Hospital Director / Director of QM&PS","whenText":"January 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Charter approved"},{"id":"MCH-13-A2","no":2,"action":"Configure the antenatal scheduling system to default to the named consultant for every visit.","responsible":"Health Informatics / Clinic Coordinator","whenText":"January – February 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"System reconfigured"},{"id":"MCH-13-A3","no":3,"action":"Train consultants, registrars and clinic staff on the named-consultant model.","responsible":"Training Department / Project Lead","whenText":"February 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Training complete"},{"id":"MCH-13-A4","no":4,"action":"Implement the shared-decision-making conversation template.","responsible":"Project Lead / Patient Experience Rep","whenText":"February 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Template embedded"},{"id":"MCH-13-A5","no":5,"action":"Start weekly continuity audit and feedback to consultants.","responsible":"Clinic Coordinator / QM&PS","whenText":"From March 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Weekly audit live"},{"id":"MCH-13-A6","no":6,"action":"Embed continuity KPIs in the monthly Safe Delivery KPI report.","responsible":"Project Lead / Statistics team (Sub-Project 1)","whenText":"From April 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"KPIs included monthly"},{"id":"MCH-13-A7","no":7,"action":"Implement consultant-cover protocol for planned leave with woman-centred communication.","responsible":"Project Lead / Obstetric Leadership","whenText":"From March 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Cover protocol active"},{"id":"MCH-13-A8","no":8,"action":"Review walk-in / unscheduled flows and reduce inadvertent continuity breaks.","responsible":"Clinic Coordinator / Project Lead","whenText":"Q2 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Reviewed"},{"id":"MCH-13-A9","no":9,"action":"Quarterly review of continuity KPIs with patient-experience feedback.","responsible":"Project Lead / Patient Experience Rep","whenText":"Quarterly throughout 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Q1 and Q2 reviews completed"},{"id":"MCH-13-A10","no":10,"action":"Annual review and refresh of the continuity model for 2026.","responsible":"Hospital Director / Project Lead","whenText":"December 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Planned"}],"milestones":[],"kpis":[],"team":[{"role":"Consultant Obstetrician (Clinic Continuity Lead)","name":"","responsibility":"Project Lead"},{"role":"Antenatal Clinic Coordinator","name":"","responsibility":"Scheduling & Continuity Tracking"},{"role":"Senior Obstetric Registrar","name":"","responsibility":"Clinical Liaison"},{"role":"Head Nurse, Antenatal Clinic","name":"","responsibility":"Patient Flow & Continuity Audit"},{"role":"Patient Experience Representative","name":"","responsibility":"Voice of the Patient"},{"role":"Health Informatics Specialist","name":"","responsibility":"EMR / Scheduling Configuration"}],"source":{"file":"03_Clinic_Continuity_with_Named_Consultants.docx","type":"Quality Improvement Project Charter Worksheet","verifiedExtraction":true},"featured":false,"category":"Quality Improvement","programmeId":"safe-delivery","summary":"Improve antenatal care continuity through assignment to named obstetric consultants.","charter":{"background":"","problem":"Pregnant women currently see different consultants between visits, fragmenting the therapeutic relationship and undermining shared decision-making. Lack of continuity contributes to patient anxiety, lower trust, weaker engagement with natural-birth preparation, and a higher rate of unnecessary Caesarean Sections, especially among primigravida women and women with one previous CS.","aim":"Within 12 months (January – December 2025) achieve ≥ 80% adherence to the same-consultant continuity model across antenatal visits, supporting shared decision-making and contributing to the wider CS-reduction targets in the Safe Delivery programme.","smart":{},"scope":"","benefits":"","strategy":"Aligned with the hospital strategic objective of “Zero preventable maternal and neonatal deaths”, CBAHI Patient and Family Centred Care standards, MOH National Patient Safety Goals, and Saudi Vision 2030 quality-of-life and human-capability pillars.","measures":"Outcome measures: Caesarean Section rate among primigravida women; CS rate among women with one previous CS; patient-experience satisfaction with continuity; anxiety scores (validated tool) at booking and at 36 weeks.\nProcess measures: % of antenatal visits with the named consultant (target ≥ 80%); % of women with a clearly named consultant in the EMR; % of women receiving a shared-decision-making conversation; % of unplanned consultant changes.\nBalancing measures: Clinic waiting times; consultant clinic-load balance; staffing flexibility during leave; access for new bookings.","changeIdeas":["A. Assign every pregnant woman to a named consultant at first booking.","B. Configure the antenatal scheduling system to default to the named consultant for all subsequent visits.","C. Audit weekly the % of visits with the named consultant and feed back to the team.","D. Establish a structured shared-decision-making conversation template (e.g. for mode of delivery).","E. Implement consultant-cover arrangements that minimise hand-offs during planned leave.","F. Embed continuity metrics into the monthly KPI report (with Sub-Project 1)."],"businessCase":"Continuity of care has strong evidence for reducing intervention rates, anxiety, and litigation, while improving satisfaction. The estimated investment of SAR 15,000 (scheduling configuration, audit, training) is recovered through reductions in unnecessary CS, shorter stays, fewer complaints, and stronger CBAHI accreditation evidence on patient-centred care."},"approvedProgress":null,"reportedProgress":null,"statusVerified":false,"createdBy":"Initial catalogue","updatedBy":"Initial catalogue"},{"id":"MCH-14","code":"MCH-14","title":"Telemedicine Virtual Consultations Between Primary Care and Obstetric Consultants","shortTitle":"Telemedicine Virtual Consultations Between Primary Care and Obstetric Consultants","officialTitle":"Sub-Project 4 – Telemedicine Virtual Consultations between Primary Care Centres and Obstetric Consultants","department":"Obstetrics","documentedStatus":"Pending Verification","operationalStatus":"Pending Verification","operationalStatusSource":"Awaiting Quality Department verification","documentedStatusSource":"Previously supplied project information","owner":"","lead":"Consultant Obstetrician – Telemedicine Lead","sponsor":"Mr. Khalid Matar Alanizi – Hospital Director","startDate":"2025-01-01","endDate":"2025-12-31","budget":30000,"actions":[{"id":"MCH-14-A1","no":1,"action":"Charter the Telemedicine Consultation project; appoint Lead and define governance.","responsible":"Hospital Director / Director of QM&PS","whenText":"January 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Chartered"},{"id":"MCH-14-A2","no":2,"action":"Procure / configure the telemedicine platform; test connectivity at pilot PCCs.","responsible":"Telemedicine / IT Coordinator","whenText":"January – February 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Platform live for pilot"},{"id":"MCH-14-A3","no":3,"action":"Develop triage criteria, request form, and virtual-clinic rota.","responsible":"Telemedicine Lead / Clinic Coordinator","whenText":"February 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Criteria approved"},{"id":"MCH-14-A4","no":4,"action":"Train PCC physicians and hospital consultants on the workflow.","responsible":"Training Department","whenText":"February 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Training completed"},{"id":"MCH-14-A5","no":5,"action":"Pilot with two PCCs and refine the workflow.","responsible":"Telemedicine Lead","whenText":"February – March 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Pilot in progress"},{"id":"MCH-14-A6","no":6,"action":"Full rollout to all affiliated PCCs.","responsible":"Telemedicine Lead / Hospital Director","whenText":"April – June 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Rollout proceeding"},{"id":"MCH-14-A7","no":7,"action":"Integrate virtual consultations with MDT (Sub-Project 2) and DRC (Sub-Project 5).","responsible":"Telemedicine Lead / MDT Lead / DRC Chair","whenText":"Q2 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Integration live"},{"id":"MCH-14-A8","no":8,"action":"Monthly telemedicine KPI report; quarterly steering review with primary-care leadership.","responsible":"Telemedicine Lead / QM&PS","whenText":"Monthly and Quarterly throughout 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Reports running"},{"id":"MCH-14-A9","no":9,"action":"Patient-experience feedback after each virtual encounter.","responsible":"Patient Experience Rep","whenText":"From March 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Feedback collected"},{"id":"MCH-14-A10","no":10,"action":"Annual review and refresh of the telemedicine model for 2026.","responsible":"Hospital Director / Telemedicine Lead","whenText":"December 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Planned"}],"milestones":[],"kpis":[],"team":[{"role":"Consultant Obstetrician (Telemedicine Lead)","name":"","responsibility":"Project Lead"},{"role":"Senior Obstetric Registrar","name":"","responsibility":"Virtual Consultation Rota"},{"role":"Telemedicine / IT Coordinator","name":"","responsibility":"Connectivity & Platform"},{"role":"Primary Care Centre Lead Physician","name":"","responsibility":"Source-site Coordinator"},{"role":"Clinic Continuity Coordinator","name":"","responsibility":"Triage and Booking"},{"role":"Patient Experience Representative","name":"","responsibility":"Voice of the Patient"}],"source":{"file":"04_Telemedicine_Virtual_Consultations.docx","type":"Quality Improvement Project Charter Worksheet","verifiedExtraction":true},"featured":false,"category":"Quality Improvement","programmeId":"safe-delivery","summary":"Introduce virtual consultations between primary care centres and obstetric consultants.","charter":{"background":"","problem":"Pregnant women followed in primary care centres are frequently referred to the hospital for in-person obstetric consultation, including for cases that could be managed remotely or that need education and reassurance rather than escalation. Late or unnecessary referrals contribute to clinic congestion, patient anxiety, and elective CS requests, while the absence of a virtual link delays clinical decision-making and shared decision-making.","aim":"Within 12 months (January – December 2025) launch a telemedicine link between affiliated primary care centres and obstetric consultants delivering at least 60 virtual consultations per month, reducing unnecessary in-person referrals by ≥ 30% and contributing to reduction of elective CS requests among primigravida women and women with one previous CS.","smart":{},"scope":"","benefits":"","strategy":"Aligned with the hospital strategic objective of “Zero preventable maternal and neonatal deaths”, CBAHI Continuity of Care standards, MOH Telehealth and Digital Health priorities, and Saudi Vision 2030 Digital Transformation pillar.","measures":"Outcome measures: Number of unnecessary in-person referrals (target downward trend); Caesarean Section rate among primigravida and one-previous-CS women; patient-experience satisfaction.\nProcess measures: Number of virtual consultations per month (target ≥ 60); time from primary-care request to virtual consultation (target ≤ 5 working days); % of virtual consultations completed with full documentation.\nBalancing measures: Hospital obstetric-clinic load; consultant time on virtual sessions; primary-care consultation time; equity of access across centres.","changeIdeas":["A. Establish a structured telemedicine link between affiliated primary care centres and hospital obstetric consultants.","B. Define a virtual-consultation request and triage pathway.","C. Embed early virtual assessment for women considered for elective CS.","D. Identify cases requiring additional patient education or psychological support and route to Sub-Project 2 (MDT).","E. Use virtual consultations to support shared decision-making with the woman and family.","F. Use virtual consultations to reduce unnecessary obstetric referrals."],"businessCase":"Telemedicine reduces unnecessary hospital referrals, decongests the antenatal clinic, supports early shared decision-making, and reduces unnecessary CS requests. The estimated investment of SAR 30,000 (platform, training, primary-care site equipment) is recovered through avoided referrals, shorter hospital stays, and improved consultant efficiency. The project also strengthens the hospital’s alignment with Saudi Vision 2030 digital-health goals."},"approvedProgress":null,"reportedProgress":null,"statusVerified":false,"createdBy":"Initial catalogue","updatedBy":"Initial catalogue"},{"id":"MCH-15","code":"MCH-15","title":"Decision Review Committee for Caesarean Section Decisions","shortTitle":"Decision Review Committee for Caesarean Section Decisions","officialTitle":"Sub-Project 5 – Decision Review Committee (DRC) for Caesarean Section Decisions in Primigravida Women and Women with One Previous CS","department":"Obstetrics","documentedStatus":"Pending Verification","operationalStatus":"Pending Verification","operationalStatusSource":"Awaiting Quality Department verification","documentedStatusSource":"Previously supplied project information","owner":"","lead":"Consultant Obstetrician – DRC Chair","sponsor":"Mr. Khalid Matar Alanizi – Hospital Director","startDate":"2025-01-01","endDate":"2025-12-31","budget":15000,"actions":[{"id":"MCH-15-A1","no":1,"action":"Charter the DRC; agree terms of reference, quorum, fast-track route, documentation tool.","responsible":"Hospital Director / Director of QM&PS","whenText":"January 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Charter approved"},{"id":"MCH-15-A2","no":2,"action":"Develop and approve the structured CS-decision documentation template.","responsible":"DRC Chair / QM&PS","whenText":"January – February 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Template approved"},{"id":"MCH-15-A3","no":3,"action":"Train all consultants, registrars, social workers, and patient-experience reps on the DRC pathway.","responsible":"Training Department","whenText":"February 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Training completed"},{"id":"MCH-15-A4","no":4,"action":"Launch DRC for elective decisions in target cohorts.","responsible":"DRC Chair","whenText":"February 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Live for elective decisions"},{"id":"MCH-15-A5","no":5,"action":"Launch the fast-track DRC route for urgent intrapartum decisions.","responsible":"DRC Chair / Head Nurse L&D","whenText":"March 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Live with quorum protocols"},{"id":"MCH-15-A6","no":6,"action":"Implement structured family-engagement workflow with social worker and patient-experience rep.","responsible":"Clinical Social Worker / Patient Experience Rep","whenText":"March 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Workflow live"},{"id":"MCH-15-A7","no":7,"action":"Embed DRC KPIs in the monthly Safe Delivery KPI report.","responsible":"DRC Chair / Statistics team (Sub-Project 1)","whenText":"From April 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Included monthly"},{"id":"MCH-15-A8","no":8,"action":"Link DRC outcomes with the RCA programme (Sub-Project 6).","responsible":"DRC Chair / RCA Lead","whenText":"Q2 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Linkage live"},{"id":"MCH-15-A9","no":9,"action":"Quarterly steering review of CS rate, VBAC, and severe maternal morbidity.","responsible":"DRC Chair / Hospital Director","whenText":"Quarterly throughout 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Q1 and Q2 completed"},{"id":"MCH-15-A10","no":10,"action":"Annual review and refresh of the DRC for 2026.","responsible":"Hospital Director / DRC Chair","whenText":"December 2025","start":"","due":"","status":"Pending Verification","progress":null,"weight":1,"evidenceRequired":false,"notes":"","documentedNote":"Planned"}],"milestones":[],"kpis":[],"team":[{"role":"Consultant Obstetrician (Chair)","name":"","responsibility":"DRC Chair"},{"role":"Second Consultant Obstetrician","name":"","responsibility":"Required Reviewer per Case"},{"role":"Clinical Social Worker","name":"","responsibility":"Family Engagement & Patient Voice"},{"role":"Patient Experience Representative","name":"","responsibility":"Voice of the Patient"},{"role":"Senior Obstetric Registrar (Secretariat)","name":"","responsibility":"Documentation & Logistics"},{"role":"Head Nurse, Labour & Delivery","name":"","responsibility":"Operational Liaison"}],"source":{"file":"05_Decision_Review_Committee_for_CS_Decisions.docx","type":"Quality Improvement Project Charter Worksheet","verifiedExtraction":true},"featured":false,"category":"Quality Improvement","programmeId":"safe-delivery","summary":"Review Caesarean Section decisions in primigravida women and women with one previous CS.","charter":{"background":"","problem":"At baseline, CS decisions in primigravida women and women with one previous CS are made by a single obstetrician without a structured peer-review process and without formal engagement of the woman’s voice or family. This contributes to clinical variability, potentially avoidable CS, and weaker shared decision-making, against a CS rate that ranged 29.0–45.8% across 2024 versus a target of ≤ 30.2%.","aim":"Within 12 months (January – December 2025) establish a Decision Review Committee that reviews and signs off 100% of CS decisions in primigravida women and women with one previous CS, with at least two consultants, a clinical social worker, and a patient-experience representative, while engaging the woman and (with her consent) a first-degree relative, to reduce avoidable CS by ≥ 20% in these cohorts.","smart":{},"scope":"","benefits":"","strategy":"Aligned with the hospital strategic objective of “Zero preventable maternal and neonatal deaths”, CBAHI Patient and Family Centred Care, MOH National Patient Safety Goals, and Saudi Vision 2030 quality-of-life pillar.","measures":"Outcome measures: CS rate among primigravida women; CS rate among women with one previous CS; VBAC success rate; severe maternal morbidity.\nProcess measures: % of CS decisions in target cohorts reviewed by the DRC (target 100%); % with two consultants signing off; % with family engagement; time from DRC request to decision (target ≤ 48 h for elective decisions).\nBalancing measures: Delay in surgical decision for genuinely indicated CS; consultant workload; patient anxiety from added discussion steps; emergency-CS readiness.","changeIdeas":["A. Charter the Decision Review Committee with terms of reference and quorum rules.","B. Mandate DRC review for every CS proposed in the target cohorts.","C. Require two consultants, a clinical social worker, and a patient-experience representative on every review.","D. Engage the woman and (with her consent) a first-degree relative in the discussion.","E. Use a structured CS-decision documentation template, evidence-based and CS-Reduction-Pathway-aligned.","F. Feed DRC outcomes into the monthly Safe Delivery KPI report and into RCA (Sub-Project 6)."],"businessCase":"Peer review of CS decisions has strong evidence for reducing avoidable surgery while protecting safety. The DRC reduces operating-room time, anaesthesia consumables, surgical-site infections, blood-product use, and length of stay. The estimated investment of SAR 15,000 (committee time, training, documentation tools) is recovered many times through avoided CS. The DRC also strengthens shared decision-making, CBAHI patient-centred-care evidence, and medico-legal robustness."},"approvedProgress":null,"reportedProgress":null,"statusVerified":false,"createdBy":"Initial catalogue","updatedBy":"Initial catalogue"},{"id":"MCH-16","code":"MCH-16","title":"Emergency Caesarean Section Audit & Root Cause Analysis Programme","shortTitle":"Emergency Caesarean Section Audit & Root Cause Analysis Programme","officialTitle":"Sub-Project 6 – Emergency Caesarean Section Audit and Root Cause Analysis (RCA) Programme for Primigravida Women and Women with One Previous CS","department":"Quality","documentedStatus":"Pending Verification","operationalStatus":"Pending Verification","operationalStatusSource":"Awaiting Quality Department verification","documentedStatusSource":"Previously supplied project information","owner":"","lead":"Director of Quality Management & Patient Safety – RCA Programme Lead","sponsor":"Mr. Khalid Matar Alanizi – Hospital Director","startDate":"2025-01-01","endDate":"2025-12-31","budget":18000,"actions":[{"id":"MCH-16-A1","no":1,"action":"Charter the RCA programme; agree governance, taxonomy, no-blame charter.","re arter Worksheet","verifiedExtraction":true},"featured":false,"category":"Quality Improvement","programmeId":"safe-delivery","summary":"Audit emergency Caesarean Section decisions and undertake root cause analysis.","charter":{"background":"","problem":"Emergency Caesarean Sections in primigravida women and women with one previous CS are not currently subjected to a structured root-cause analysis. As a result, systemic drivers (clinical, organisational, delay, monitoring gaps) remain undetected and the same problems recur. Against a CS rate ranging 29.0–45.8% across 2024 (vs target ≤ 30.2%), the absence of a learning loop limits the programme’s ability to deliver sustained CS-rate reduction and safety improvement.","aim":"Within 12 months (January – December 2025) audit 100% of emergency CS in primigravida women and women with one previous CS, complete a structured root-cause analysis for every case, classify causes (clinical – organisational – delay – monitoring – other), publish a monthly aggregate report, and deliver a continuous Quality Improvement Plan that reduces recurrent root causes.","smart":{},"scope":"","benefits":"","strategy":"Aligned with the hospital strategic objective of “Zero preventable maternal and neonatal deaths”, CBAHI Essential Safety Requirements, MOH National Patient Safety Goals, and Saudi Vision 2030 Health Sector Transformation – quality and safety pillar.","measures":"Outcome measures: Emergency CS rate among primigravida women; emergency CS rate among women with one previous CS; severe maternal morbidity; recurrence rate of identified root causes.\nProcess measures: % of emergency CS in target cohorts with completed RCA (target 100%); RCA completion within 14 days (target 100%); % of corrective actions implemented within 90 days (target ≥ 90%); monthly aggregate report on time (target 100%).\nBalancing measures: Staff time on RCA; psychological safety of staff under review; emergency-response readiness; overall theatre availability.","changeIdeas":["A. Establish a structured RCA pathway for every emergency CS in target cohorts.","B. Define a cause taxonomy (clinical – organisational – delay – monitoring gap – other).","C. Conduct a detailed RCA report per case using a standardised template.","D. Identify recurring patterns and publish a monthly aggregate report.","E. Generate corrective-action recommendations for every root cause.","F. Maintain a continuous Quality Improvement Plan tracked monthly."],"businessCase":"An RCA programme that converts every emergency CS into learning is one of the highest-leverage investments in patient safety and CS-rate reduction. By identifying recurring drivers (delay in escalation, weak SBAR handover, monitoring gaps, training gaps) and acting on them, the programme reduces severe maternal morbidity, NICU admissions, operating-room time, blood-product use, and medico-legal exposure. The estimated investment of SAR 18,000 (RCA tools, training, audit time) is recovered many times through avoided emergency surgery and complications."},"approvedProgress":null,"reportedProgress":null,"statusVerified":false,"createdBy":"Initial catalogue","updatedBy":"Initial catalogue"}];
/* Offline editing saves in this browser only; it does not connect to Claude or hospital servers. */
const MCH_LOCAL_KEY = 'mch.hospital.projects.local.v1';
function persistLocalProjects(){
  try { localStorage.setItem(MCH_LOCAL_KEY, JSON.stringify(Array.from(S.projects.values()))); }
  catch(e){ toast('Browser storage failed. Export your work before closing this page.',true); }
}
function downloadMCHBackup(){
 const blob=new Blob([JSON.stringify(Array.from(S.projects.values()),null,2)],{type:'application/json'});
 const u=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=u;a.download='MCH_Projects_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);
}
function activateOfflineCatalogue(){
  S.dbState='local';
  S.level='owner';
  S.me={id:'local-admin',name:'Local Quality Administrator',avatar:'',isOwner:true,canEdit:true,canWrite:true};
  let saved=null;
  try { saved=JSON.parse(localStorage.getItem(MCH_LOCAL_KEY)||'null'); } catch(e){}
  const list=Array.isArray(saved)&&saved.length?saved:MCH_OFFLINE_CATALOGUE;
  S.projects=new Map(list.map(p=>[p.id,p]));
  S.programmes=new Map([['safe-delivery',{id:'safe-delivery',name:'Safe Delivery Improvement Programme – Caesarean Section Reduction'}]]);
  S.loaded.projects=true;
  derive();renderAll();
}


/* ---------- boot ---------- */
async function boot() {
  startClock();
  try { const r = JSON.parse(localStorage.getItem('mch.read') || '[]'); if (Array.isArray(r)) S.prefs.readNotifs = r; } catch { }
  try { const v = localStorage.getItem('mch.view'); if (v && VIEWS[v] && v !== 'project') S.view = v; } catch { }
  derive(); renderAll();
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { activateOfflineCatalogue(); return; }
  const names = ['db', 'user', 'assets', 'sample', 'downloads'];
  const got = await Promise.all(names.map(n => c.use(n).catch(() => null)));
  names.forEach((n, i) => S.caps[n] = got[i]);
  const user = S.caps.user;
  if (user) {
    try {
      const me = await user.me(); S.me = { id: me.id, name: me.name, avatar: me.avatarUrl, isOwner: me.isOwner, canEdit: me.canEdit, canWrite: null };
      const cw = await user.can('data.write'); S.me.canWrite = cw;
      S.level = me.isOwner ? 'owner' : me.canEdit ? 'admin' : cw === true ? 'interact' : cw === false ? 'view' : 'interact';
    } catch (e) { console.warn('user', e); }
  }
  if (!S.caps.db) { activateOfflineCatalogue(); return; }
  S.dbState = 'live'; subscribe(); renderAll();
  setTimeout(persistNotifLog, 9000); setInterval(persistNotifLog, 3600 * 1000);
  setInterval(() => { if (!$('#modalRoot').children.length && !(S.view === 'ai' && S.ai.step >= 3)) { derive(); scheduleRender(); } }, 5 * 60 * 1000);
}
boot();
